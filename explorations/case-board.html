.pin .degt{fill:var(--panel);font-size:11px;font-weight:700}

#nar blockquote span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
#nar blockquote q{quotes:none;font:600 16.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}

#count{font-variant-numeric:tabular-nums;font-weight:600}
.src{text-transform:uppercase;letter-spacing:.05em;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
#w{font-size:23px;line-height:1.45;margin:0 0 20px;font-weight:500}

#typed{border-left:4px solid var(--new);background:var(--bg);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 20px}

#r{margin:0;font-size:18px;line-height:1.6}

.intro p{margin:0;font-size:17px;line-height:1.6}
#nw{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
#nw b{color:var(--new)}
.bar{display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:12px 44px 16px;border-top:1px solid var(--line);max-width:780px;width:100%;margin:0 auto}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
button.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
#mapcol{position:relative;min-height:0;background:var(--cork)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cork)}
#board{display:block;width:100%;height:100%}
.mapbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
.mapbar button{font-size:13px;padding:6px 11px;opacity:.95}
#key{position:fixed;top:8px;right:8px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;grid-template-columns:auto auto;gap:2px 12px;max-width:calc(100vw - 16px)}
#key.hide{display:none}
#key h4{grid-column:1/-1;margin:2px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#key .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
#key svg{flex:none}

 .mapbar{right:6px;bottom:6px}.mapbar button{font-size:12px;padding:5px 9px}
