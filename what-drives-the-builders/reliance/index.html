 {id:'n0',act:'How it started',p:[
 "Reliance turns crude oil into chemicals at Jamnagar. It also sold us our AC, the cheapest one we could find, at Reliance Digital. The same name covers a refinery, grocery shops, a phone network, cricket on TV and now AI data centres.",
 "I wanted to know how one oil company ends up doing all of that, and who actually decides what it does next."],add:[],nt:[],mv:[],intro:1},
 {id:'n0b',act:'How it started',p:[
 "Every answer came back to a few people. Mukesh Ambani decides where the money goes. His three children each run a part. Hired CEOs run pieces of those parts, and some of them leave. His father, Dhirubhai, started the company, and it will pass to the children. The people change; Reliance stays.",
 "This is two nights of asking, four months apart: typing in June, talking in October. Each step adds one piece to the map."],add:[],nt:[],mv:[],intro:2},

 // ---------- night 1: June ----------
 {id:'r1',act:'Why retail after oil',p:[
 "Reliance made its name turning oil into chemicals, then moved into shops.",
 ">Why did reliance did retail after oil",
 "One night in June I asked Gemini why a company like that would start selling groceries. It gave four reasons: a hedge against oil prices and the climate shift, most Indian shops still being unorganised, steadier cash from shoppers than from business buyers, and stores that feed the phone business."],add:['ril','o2c'],nt:[],mv:[]},
 {id:'r2',act:'Why retail after oil',p:[
 "Retail is big: about $44 billion a year, and groceries are most of it.",
 ">Break down retail buisness in terms of revenue and business metrics in usd by category and brand names",
 "All four reasons pointed at shoppers, so I wanted the size. The answer: $43.8 billion in revenue and 387 million registered customers, with groceries far ahead of everything else."],add:['retail'],nt:[],mv:[]},
 {id:'r3',act:'Why retail after oil',p:[
 "Reliance didn't simply buy Big Bazaar. It took over the store leases after the deal fell through.",
 "With that split in hand I ranked the brands myself: Smart Bazaar, Reliance Digital, Reliance Fresh. Mostly right, with Smart Bazaar first. Then I remembered Big Bazaar. The $3.4 billion deal for it fell through in 2022, so Reliance took about 800 store leases straight from the landlords."],add:[],nt:[],mv:[],f:['retail']},
 {id:'r4',act:'Why retail after oil',p:[
 "JioMart is Reliance's online grocery store.",
 ">And wtf is jiomart - who buys from it",
 "I'd heard the name for years without knowing who actually uses it. Two groups do: shoppers in smaller towns hunting discounts, and corner shops that restock through it."],add:['jiomart','re_jm'],nt:[],mv:[]},
 {id:'r5',act:'Who owns what',p:[
 "Reliance isn't one company. It's a parent that owns separate businesses, and Jio is one of them.",
 ">Jio is child company under ril?",
 "I'd come in asking about shops. If Jio sits under RIL, I wanted to know what else does."],add:['jio'],nt:[],mv:[]},
 {id:'r6',act:'Who owns what',p:[
 "Under the parent sit separate empires: energy, retail, telecom, media and finance.",
 "I asked for the whole structure of RIL in one chart, and added what I knew: Jio Studios and the IPL team sit in the media business too."],add:['media'],nt:[],mv:[]},
 {id:'r7',act:'Who owns what',p:[
 "A Reliance share is a share of the parent, RIL. Retail isn't listed on its own.",
 ">Reliance retail is independently listed?\nTodays reliance share we buy is ril share?",
 "RIL owns most of Retail and most of Jio, so buying RIL is buying a slice of all of them."],add:[],nt:[['retail','not listed on its own']],mv:[],f:['ril','retail','jio']},
 {id:'r8',act:'Who owns what',p:[
 "Jio Financial was split off from RIL and listed on its own. It runs funds with BlackRock.",
 "I compared it with Zerodha: will it run mutual funds under its own name? Yes, with BlackRock, the American fund giant, as its partner."],add:['jfs','ri_jf','blackrock','jf_br'],nt:[],mv:[]},
 {id:'r9',act:'What binds it together',p:[
 "I wanted the one idea that holds oil, shops, phones, cricket and funds together.",
 ">Why this business? Amd whats the overarching philosophy amd vision which binds all of this together",
 "A vision tells me what the people at the top want. The answer: \"What is good for India is good for Reliance.\" Each business goes after a bottleneck in daily life."],add:[],nt:[],mv:[],f:['ril','o2c','retail','jio','media','jfs']},
 {id:'r10',act:'What binds it together',p:[
 "\"Nation building\" isn't a full answer. They still have to pick which ten things to do.",
 ">Its not that simple right - nation building needs say thousand things - they have to select whcih 10 they do and sequence them",
 "The AI backed off, and called Reliance a careful allocator of money, with a filter for which ten."],add:[],nt:[],mv:[],f:['ril']},
 {id:'r11',act:'What binds it together',p:[
 "My guess at their filter: huge money upfront, and everyone ends up using it. AI fits perfectly.",
 "Payments: everyone uses them, but they need no big money upfront. Highways and airports: big money, but not everyone uses them. This is my reading of their filter, not something they've said."],add:[],nt:[],mv:[],f:['ril','jio']},
 {id:'r12',act:'What binds it together',p:[
 "For AI, Reliance would buy chips, make the power, build data centres and use someone else's model.",
 ">So ai - buy chips, produce energy, build data centers, buy model - dont think they are building theor own model from scratch- app is theors anyways",
 "TV fits my filter too: news, serials, streaming, cricket, Bollywood."],add:['dc','ji_dc'],nt:[],mv:[]},
 {id:'r13',act:'What binds it together',p:[
 "Open models make more sense for them than paying GPT or Claude for every token.",
 "Open models can sit in a data centre in India, be trained and improved, and be handed to Jio. For chips: Nvidia when they need the most advanced, maybe Google's TPUs too."],add:[],nt:[],mv:[],f:['dc','jio']},
 {id:'r14',act:'The people',p:[
 "Every one of these plans needs a huge number of people.",
 ">All of this would require massive massive workforce- excluding ops work",
 "The answer agreed that people are the choke point: money buys land and chips, not engineers. Reliance's plan is to lure Indian researchers home with computing power and to fund university programmes."],add:[],nt:[],mv:[],f:['dc','ril']},
 {id:'r15',act:'The people',p:[
 "Mukesh runs all of it with a very small group at the top.",
 ">I mean not just the ai thing - while ril business- how does mukesh operates? Like Microsoft has cvp, jensen has 23 direct reports",
 "Microsoft has layers of vice presidents. Jensen Huang keeps a flat team. Reliance has a small circle, led by the owner."],add:['mukesh','mu_ri'],nt:[],mv:[]},
 {id:'r16',act:'The people',p:[
 "Each business has hired CEOs, about seven in all, and they answer to Mukesh.",
 ">Who all are these ceos and how many",
 "Pankaj Pawar and Kiran Thomas at Jio, Jeyandran Venugopal at Retail, Hitesh Sethia at Jio Financial, Kevin Vaz and Kiran Mani in media."],add:['ceos','ce_mu'],nt:[],mv:[]},
 {id:'r17',act:'The people',p:[
 "Anant, the youngest son, runs the energy side, oil included.",
 "Gemini suggested a follow-up and I tapped it: who runs the old oil business, if the heirs are focused on retail, tech and green energy?"],add:['anant','an_o2','an_mu'],nt:[],mv:[]},
 {id:'r18',act:'The people',p:[
 "A family business hiring global tech people is a marriage that may not last.",
 ">Tech ceos is where core indian folls meet global folks - so that marriage is interesting if it survives- these tech ceos are all new"],add:[],nt:[],mv:['will the hired tech people stay?'],people:1,f:['ceos','mukesh']},
 {id:'r19',act:'The people',p:[
 "Kiran Mani shows it: he ran JioStar's digital side, then left to run OpenAI in Asia.",
 ">Kiran mani left for oai",
 "The answer called it the perfect case study of that fragile marriage."],add:['kiran','ki_md','openai','ki_oa','usa','us_oa'],nt:[],mv:[],people:1},
 {id:'r20',act:'The people',p:[
 "To keep people like that, the job has to feel like a mission for the country, plus world-class standing. That's my guess, not a fact.",
 ">Nation building- like in arm forces - has to Probably be up for nation building plus high class in ceoness"],add:[],nt:[],mv:['a mission, plus standing (my guess)'],people:1,f:['ceos','kiran']},
 {id:'r21',act:'Government and the gaps',p:[
 "Reliance works alongside the government, as a kind of infrastructure partner.",
 ">And how specifically is this tied with government and politics as nation building is theor core role",
 "If nation building is the pitch, I wanted to see where the government comes in. The answer pointed to Digital India and the like."],add:['india','gov','in_gv','gv_ri'],nt:[],mv:[]},
 {id:'r22',act:'Government and the gaps',p:[
 "By my own filter, health, education and farming should be in. Reliance is barely there.",
 ">But ynlike retail and telecom - yhey are nil in education and heath and things like agri - farmers- sector wjere 400m people are",
 "Everyone needs them, and they take big money. The answer: these run on trust and people, not spending. Farming turned political after the 2020–21 protests, health needs doctors, and an app can't replace a teacher."],add:[],nt:[],mv:[],f:['ril','gov']},
 {id:'r23',act:'The other groups',p:[
 "Next I put Reliance beside Adani, Tata and Birla, to compare how each group thinks.",
 ">Adani vs tata vs birlas in same axis compare ideologies etc whatever we have discussed in the thread",
 "Reliance owns the pipes everyone uses. Adani builds what the state needs. Tata is mostly owned by charitable trusts. Birla makes cement and aluminium."],add:['groups','gr_ri'],nt:[],mv:[]},
 {id:'r24',act:'The other groups',p:[
 "Real estate, banks, education, health: none of the big groups really owns them.",
 ">Real estate? Banks? Education? Heath? These sectors are not covered/owned by these groups",
 "Lining the groups up made the gaps show. The answer: real estate is local land and politics, banks run into the RBI's rules for business groups, and health and education come back to trust."],add:[],nt:[],mv:[],f:['groups']},
 {id:'r25',act:'The other groups',p:[
 "Where Reliance goes, it comes for all of it.",
 ">So reliance mostly in category they operate - they mostly come for everything, sheer dominance",
 "Even retail, small next to telecom and streaming, is big enough to set the market."],add:[],nt:[],mv:[],f:['ril','retail','jio']},
 {id:'r26',act:'The other groups',p:[
 "We bought our AC at Reliance Digital because it was the cheapest.",
 ">We had to buy ac - cheapest was in reliance digital",
 "The answer: it buys straight from makers, gets volume rebates, and earns the margin back elsewhere in the group. I said Amazon and Croma have the same advantages. Same pool, it said, different games: Amazon spends to win, Croma sells on service."],add:['digital','re_rd'],nt:[],mv:[]},
 {id:'r27',act:'The other groups',p:[
 "It isn't just Reliance. No group, and not even the government, has made a dent in education, health and farming.",
 ">I think not just teliance - no business group and even govt has not made a demt in education , health and agriculture",
 "I added this the next afternoon."],add:[],nt:[],mv:[],f:['groups','gov']},
 {id:'r28',act:'The other groups',p:[
 "Jamnagar is where the refinery is, on the coast of Gujarat.",
 "That evening I looked it up on Maps, to see the refinery and whether it has a port. Maps showed a Jamnagar Port, and that is where the June trail ends."],add:['jamnagar','o2_jn'],nt:[],mv:[]},

 // ---------- night 2: October ----------
 {id:'s1',act:'Who runs what',p:[
 "Each of Mukesh's three children runs one part: Anant energy, Isha retail, Akash telecom.",
 "<So, company: Anand Money has the oil business, Esha Money has the retail business, and Akash Money has the telecom business. Is that split correct?",
 "Four months later I came back to it late at night, speaking instead of typing. Jio Platforms had listed the week before. The split was mostly right, names aside."],add:['isha','is_re','is_mu','akash','ak_ji','ak_mu'],nt:[['jio','listed October 2026']],mv:[]},
 {id:'s2',act:'Who runs what',p:[
 "Media sits with Akash too: JioHotstar, Mumbai Indians, the film studio.",
 "<So then what about G Hotstar and Mumbai Zenith, the other sports franchise that is under all?"],add:['ak_md'],nt:[],mv:[]},
 {id:'s3',act:'Who runs what',p:[
 "Four people sit at the top: Mukesh and his three children.",
 "<Basically all Reliance businesses, we are trying to map them to these four individuals who hit them directly.",
 "I wanted every business mapped to one of them."],add:[],nt:[],mv:[],people:1,f:['mukesh','anant','isha','akash']},
 {id:'s4',act:'Whose money',p:[
 "The children run the businesses. The money is Mukesh's.",
 "<Obviously everything is under Mukesh's money overall anyways.",
 "The answer agreed: he decides where the capital goes, and they run the operations."],add:[],nt:[['mukesh','decides where the money goes']],mv:['Mukesh: the money stays with him'],people:1,f:['mukesh','ril']},
 {id:'s5',act:'What I can buy',p:[
 "A Reliance share is still a share of RIL, the parent.",
 "<Now so when I buy the share of Reliance that is R I L's share is it",
 "The same question I'd asked in June."],add:[],nt:[],mv:[],f:['ril']},
 {id:'s6',act:'What I can buy',p:[
 "The new listing was Jio Platforms, the telecom and tech arm.",
 "<So the latest Jio IPO is is for what then?",
 "RIL is listed. Jio Financial was split off and listed. This was the third."],add:[],nt:[],mv:[],f:['ril','jfs','jio']},
 {id:'s7',act:'How they feed each other',p:[
 "I guessed wrong: media sits with Akash, not Anant. The data centres sit under Jio Platforms.",
 "<So this network 18 and the whole thing sits under Anant is it like Jio Hotstar and Jio cinemas"],add:[],nt:[],mv:[],f:['akash','media','dc','jio']},
 {id:'s8',act:'How they feed each other',p:[
 "Anant's energy business powers Akash's data centres. The brothers' businesses feed each other.",
 "<So, in geo platforms, we'll need energy for data centers. So, it's like this vertical is getting its services to that vertical.",
 "Data centres need power, and the oil business is the energy business too."],add:['o2_dc'],nt:[],mv:[]},
 {id:'s9',act:'The finance arm',p:[
 "Jio Financial is not a bank. It's an investment company the RBI regulates.",
 "<Jiofin is for what then? Finance for what",
 "It does wallets, loans and investing, for people and for shops."],add:[],nt:[['jfs','not a bank']],mv:[],f:['jfs']},
 {id:'s10',act:'The finance arm',p:[
 "Splitting finance off was a deliberate move, and games this big need a big reason.",
 "<why go all the way to create the independent structures demerge all of that I mean because these are like very very very very big games right so the objective also must have been like quite grand",
 "The reason given: a finance arm needs its own capital and carries loans, so splitting it off keeps that weight off RIL's books."],add:[],nt:[],mv:[],f:['jfs','ril']},
 {id:'s11',act:'The finance arm',p:[
 "Lending pays today. The funds compound later.",
 "So they lend now, and the fund house with BlackRock grows over time, the way Zerodha has its own fund house."],add:[],nt:[],mv:[],f:['jfs','blackrock']},
 {id:'s12',act:'The finance arm',p:[
 "The payments side is the Paytm game, with a much bigger group behind it.",
 "<And payments Bank is separate from nbfc arm. What's the payments Bank game So looks like this consumer thing is what paytm is"],add:['paytm','jf_pt'],nt:[],mv:[]},
 {id:'s13',act:'The finance arm',p:[
 "In UPI, Jio barely shows up. Its play is shops, not people.",
 "<if you take UPI payment share … Google Pay, PhonePe, and Paytm. So … where is sort of Jio this payments bank in that?",
 "The QR codes and card machines at the counter, like Pine Labs."],add:['upi','pt_up','jf_up'],nt:[],mv:[]},
 {id:'s15',act:'The finance arm',p:[
 "Jio's payments are for walking into a store and scanning a code, not paying on a website.",
 "<So, the Jio thing that we're talking about is for all offline payments. Go to the store or the vendor, scan the QR."],add:[],nt:[],mv:[],f:['jfs','upi']},
 {id:'s16',act:'Is the flywheel real',p:[
 "Cross-selling alone can't be the strategy. Each business has to make money on its own.",
 "<So it looks like cross-selling itself cannot be a business strategy, right?",
 "I took a summary of everything to a fresh chat. Someone with Jio fibre may watch Hotstar, but won't keep buying more and more from the same family."],add:[],nt:[],mv:[],f:['jio','media','retail']},
 {id:'s17',act:'Is the flywheel real',p:[
 "My reading of the method: spend big upfront, price out the others, then lock customers into the whole family of businesses.",
 "<The core thing in itself has to work. Plus as a standalone player, you will have a CAC problem there. This whole flywheel can severely reduce CAC",
 "The AI agreed and laid it out in four stages: oil cash pays for the build, tens of billions go into fibre, towers and stores, prices drop low enough to squeeze rivals, and the services lock customers in. An AI agreeing doesn't make it true."],add:[],nt:[],mv:['invest big, price out, lock in (my reading)'],people:1,f:['ril','mukesh']},

 // ---------- conclusion ----------
 {id:'c1',act:'Where the nights landed',p:[
 "Two nights, and I ended up at the same family both times. Mukesh keeps the money. Anant, Isha and Akash each run a part. The hired CEOs run pieces of those parts, and some, like Kiran Mani, leave for OpenAI.",
 "Oil paid for the shops, the phones and now the data centres, and the parts feed each other. It runs like a family business that happens to be one of the biggest in the country."],add:[],nt:[],mv:[],core:1},
 {id:'n8',act:'What is still open',p:[
 "What stays with me is what's missing. By their own filter, huge money upfront and everyone uses it, health, education and farming should be in. Around 400 million people work in farming. Reliance is barely there, and neither is any other group, or the government.",
 "So I'm left with a question that isn't about Reliance. Who builds those, and what would make someone want to?"],add:[],nt:[],mv:[],core:1}
