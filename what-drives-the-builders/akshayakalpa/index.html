<script>
(function(){
var N=25;
var T=[
 {lab:'Opening',h1:'Where clean food starts',p:[
  "This page follows one person's research into one model: Akshayakalpa, an organic dairy started in Karnataka in 2010.",
  "The idea behind the model is simple to say. Clean food needs healthy soil, and healthy soil only lasts if the farmer earns from it. Tied up with income is a fourth thread: whether young people stay in farming at all.",
  "Under all of it sit the reasons of the two people who built it."],add:[]},
 {lab:'Opening',h:'How the trail went',p:[
  "Pranav didn't follow a plan. He kept asking questions, and each answer led to the next one. Every step here opens with the question he actually asked, word for word, with when and where he asked it: a YouTube search, a voice chat with an AI, a note he spoke into his phone. Then what he found, and where it took him next.",
  "Some steps have no question of his attached. Those just show what he found.",
  "%"],add:[]},
 {chap:'Chapter 1 of 4 · The founders',h:'It started with a name',ask:['The question that opened this chapter','Shashi Kumar','A YouTube search, 16 Aug 2024. A minute later: “shashi kumar akshayakalpa”.'],p:[
  "Shashi Kumar runs Akshayakalpa. Half his career was at Wipro, the IT company, and half in farming.",
  "Starting with the founder is deliberate. The founder shows who wanted this thing to exist.",
  "=In his words · spoken note, 2 Nov 2026|Ah so he's a once in a generation kind of an entrepreneur."],
  led:['p','Next: who started it with him?'],add:['shashi','co','s1']},
 {chap:'Chapter 1 of 4 · The founders',h:'The less visible co-founder',p:[
  "Dr GNS Reddy is Shashi's uncle, a veterinary scientist. He came from BAIF, a rural development group, and ran a farming NGO for women before 2010. Akshayakalpa started with him on 2 October 2010. Shashi is co-founder and CEO; no public source gives Dr Reddy's title.",
  "Pranav's own picture had to move here. His February 2026 notes had it the other way round:",
  "^His notes, 24 Feb 2026|Founder: G.N.S. Reddy (former IT professional)",
  "It is Shashi who came from IT. Dr Reddy came from rural development."],
  led:['q','he says let’s say he cares about farmer and reviving agriculture I mean I mean really really really why is that I mean. Because it’s not about money. So is it about the country? Is it about the fellow man?','Spoken note, 2 Nov 2026'],add:['reddy','s2','notes','s5']},
 {chap:'Chapter 1 of 4 · The founders',h:'Why would he go back to farming?',ask:['He asked','he says let’s say he cares about farmer and reviving agriculture I mean I mean really really really why is that I mean. Because it’s not about money. So is it about the country? Is it about the fellow man?','A note he spoke into his phone, 2 Nov 2026, 2:13 pm'],p:[
  "The answer is in Shashi's own interviews. A hailstorm hit his family's farm in 1981. Years later he read Fukuoka, the Japanese natural farmer who wrote The One-Straw Revolution.",
  "^Shashi Kumar, in his words|See, absentee farming doesn't work."],
  led:['p','Next: what did wanting it cost them?'],add:['why','s3','s4','t1','t2']},
 {chap:'Chapter 1 of 4 · The founders',h:'What it cost them',p:[
  "Shashi's father didn't speak to him for eight years. He took no salary for nine. In 2017 the company had ₹10,000 left in the bank.",
  "^Shashi Kumar, in his words|Six times we claim came close to bankruptcy.",
  "=In his words · 23 Nov 2026|Again, the mental model is to anyone, right, to anyone what they want, do they really, really want it? And then the universe will test it: do you really, really want it? And only share... or bestow the secrets to you only if you like really, really, really want it. And this is like the prime example."],
  led:['q','but in agri - soil health is the most fundamental thing right','Chapter 2 opens with this · Google AI Mode, 5 Aug 2026'],add:['t3','t4','t5']},
 {chap:'Chapter 2 of 4 · The soil',h:'Back to the ground',vb:2,ask:['The question that opened this chapter','but in agri - soil health is the most fundamental thing right','Google AI Mode, 5 Aug 2026, while reading about a soil-carbon startup. Just before it he asked: “so is it about soil and not using fertilizers?”'],p:[
  "Three months later he found the soil inside Akshayakalpa's own story. The company's film says organic carbon in its farmers' soil went from 0.32% to 2.44%.",
  "That is the company's figure. No outside study of it turned up. The nearest outside mention is from Nithin Kamath of Rainmatter, one of its investors, in September 2025: from about 0.3% to as high as 2.5% “in some patches”.",
  "Shashi says India's soils have been sliding the other way since 1970."],
  led:['q','...Because company is, because this kite thing is talking about the farm, right? Not the company.','Voice chat with Gemini, 3 Nov 2026, 9:10 am'],add:['soil','k3','k4']},
 {chap:'Chapter 2 of 4 · The soil',h:'The kite is the farm',vb:2,ask:['He asked','...Because company is, because this kite thing is talking about the farm, right? Not the company.','Voice chat with Gemini, 3 Nov 2026, 9:10 am'],p:[
  "^Shashi Kumar, in his words|Consider farmer as a kite… Kite needs to be balanced.",
  "Yes, the kite is the farm. A balanced farm has cows, compost, trenches and bunds, hedges, and a pond for every three acres. Each part feeds another, and the soil sits under all of it."],
  led:['p','Next: where does government come in?'],add:['farm','x1','k1','k2']},
 {chap:'Chapter 2 of 4 · The soil',h:'What only government can do',vb:2,p:[
  "Government barely shows up in his searches. It does show up in Shashi's words: farmland is turning to desert, and the farm extension system, the people who advise farmers, belongs to government. A private company can't change it.",
  "The money runs the other way. The fertiliser subsidy was budgeted at ₹1.64 lakh crore for 2024-25. The government's natural farming mission, approved in November 2024, has ₹2,481 crore in all.",
  "His February 2026 notes said ₹10,000 crore, enough for 100 Akshayakalpa-style platforms, is less than one week of fertiliser subsidy. The sum is off: ₹1.64 lakh crore a year is about ₹3,150 crore a week, so ₹10,000 crore is about three weeks. The point still stands."],
  led:['q','So out of, let’s say, what, this 700 720 crores? Like what percentage will estimated would that be?','Chapter 3 opens with this · Voice chat with Gemini, 3 Nov 2026, 6:34 am'],add:['gov','x2','k5','k6']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'What does a farmer get?',vb:3,ask:['The question that opened this chapter','So out of, let’s say, what, this 700 720 crores? Like what percentage will estimated would that be?','Voice chat with Gemini, 3 Nov 2026, 6:34 am. A minute later: “Check interviews. He would have mentioned somewhere in interviews how much they pay. How many farmers?”'],p:[
  "The ₹720 crore is a year of sales at the pace Shashi gave in June 2026, about ₹60 crore a month. The company's own yearly figures are lower: about ₹285 crore in 2023-24 and about ₹395 crore in 2024-25. No figure for 2025-26 is public yet.",
  "In June 2026 about 2,800 farm families supplied it. Shashi says the company paid each family about ₹1.28 lakh a month on average last year, mostly for milk. That is what the family receives, before feed, labour and other costs, so it is not take-home income.",
  "For comparison, the government's survey of farm households for 2018-19 put average income at ₹10,218 a month.",
  "=In his words · voice chat with Gemini, 3 Nov 2026, 6:34 am|So that's revenue, right? But again, right, their main cost is they have to pay out farmers."],
  led:['q','And then farmer payout would be how much? 38 crore?','Voice chat with Gemini, 3 Nov 2026, 6:38 am'],add:['fam','x3','g1','g2']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'Where the money goes',vb:3,ask:['He asked','And then farmer payout would be how much? 38 crore?','Voice chat with Gemini, 3 Nov 2026, 6:38 am'],p:[
  "He worked it out himself, out loud:",
  "=In his words · voice chat with Gemini, 3 Nov 2026|So out of 60 crore that is coming in, 36 is going to farmers. Rest is 24.",
  "That 60% share is an estimate, not a figure the company has published. What Shashi has said is the rule behind it:",
  "^Shashi Kumar, in his words|If a farmer is not profitable, there is no way Akshay Kalpa can become profitable.",
  "The company itself is only just there. Shashi told Inc42 it lost ₹6.5 crore in 2024-25 and has made a profit since April 2025. That is his figure; the filed accounts weren't seen."],
  led:['p','Next: why farming doesn’t pay in the first place.'],add:['g3']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'Why farming does not pay',vb:3,p:[
  "^Shashi Kumar, in his words|The fundamental problem of farming is there's no cash flows.",
  "A farm spends every day but gets paid at harvest. Milk is different: it sells every day. Nandini, Karnataka's milk co-operative, proved that for dairy long ago. A post by Nikhil Kamath made the same point about milk's sure buyer.",
  "^His notes, 24 Feb 2026|the problem isn't farming itself — it's that farmers are isolated, undercapitalized, and have no market guarantee."],
  led:['q','So let’s double-click on all these estimates. So what’s the logistics and supply chain that is basically trans and cold storage? …','Voice chat with Gemini, 3 Nov 2026, 6:42 am'],add:['nandini','x4']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'From cow to doorstep',vb:3,ask:['He asked','So let’s double-click on all these estimates. So what’s the logistics and supply chain that is basically trans and cold storage? Cold storage is at the farm level or from farm to the factory and from factory to the distribution points?','Voice chat with Gemini, 3 Nov 2026, 6:42 am'],p:[
  "Milk is chilled near the farm, then goes to one of three plants, the biggest at Tiptur. It reaches a Bangalore home in about 24 hours. Shashi says the usual is closer to 96. About 40% now sells through quick-commerce apps.",
  "=In his words · voice chat with Gemini, 3 Nov 2026, 6:50 am|So they have only one processing plant, right? They don't have like multiple?"],
  led:['q','So, uh, so you’re saying so there is a specific location where everything comes together? And in and around there, there are about a thousand farmers, so like a van goes through those thousand farmers and collects?','Voice chat with Gemini, 3 Nov 2026, 7:02 am'],add:['plant','homes','x5','x6','g4']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'The whole chain',vb:3,ask:['He asked','So, uh, so you’re saying so there is a specific location where everything comes together? And in and around there, there are about a thousand farmers, so like a van goes through those thousand farmers and collects?','Voice chat with Gemini, 3 Nov 2026, 7:02 am'],p:[
  "Not quite one van. The chain runs in steps. The farm. A local chiller, where the milk is cooled and tested. Tankers that bring it from the chillers to the plant.",
  "Then processing at the plant, dispatch to the edge of the city, and from there to homes."],
  led:['q','And they say Akshayakalpa.org, right? So, but again, they are VC-backed. So, what does it mean? I mean, what does it mean?','Voice chat with Gemini, 3 Nov 2026, 7:47 am'],add:['g5']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'Who put money in',vb:4,ask:['He asked','And they say Akshayakalpa.org, right? So, but again, they are VC-backed. So, what does it mean? I mean, what does it mean?','Voice chat with Gemini, 3 Nov 2026, 7:47 am'],p:[
  "VC-backed means outside investors own part of the company and expect it to grow and, one day, pay them back more than they put in.",
  "The first money came from people who knew the founders: 27 of Shashi's Wipro colleagues put in ₹1.5 crore in 2010. Venture Dairy, a fund run by an American dairy veteran, came in 2013. Lok Capital put in ₹40 crore in 2019 and sold its stake in January 2024."],
  led:['q','So it looks like there are businesses who would require upfront capital and then I don’t know. Is making money that hard? Because unless you make money, money is oxygen, right?','Voice chat with Gemini, typed, 3 Nov 2026, 8:19 am'],add:['wipro','vd','lok','m1','m2','m3']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'Money is oxygen',vb:4,ask:['He asked','So it looks like there are businesses who would require upfront capital and then I don’t know. Is making money that hard? Because unless you make money, money is oxygen, right?','Voice chat with Gemini, typed, 3 Nov 2026, 8:19 am'],p:[
  "Then bigger funds: Rainmatter from 2020; BII, the UK government's development investor, in 2022; A91 Partners in 2024; and ABC Impact, linked to Singapore's Temasek, leading a ₹175 crore round in 2026.",
  "Each new city cluster took about seven years to turn a profit, so the money had to last that long."],
  led:['q','No, I mean, so what’s the game here? What’s the like overall game of the company from what he has mentioned in the interviews from his own mouth?','Voice chat with Gemini, 3 Nov 2026, 8:49 am'],add:['rain','bii','a91','abc','m4','m5','m6','m7']},
 {chap:'Chapter 3 of 4 · What a farmer earns',h:'What is the game?',vb:3,ask:['He asked','No, I mean, so what’s the game here? What’s the like overall game of the company from what he has mentioned in the interviews from his own mouth?','Voice chat with Gemini, 3 Nov 2026, 8:49 am'],p:[
  "The AI kept answering with the vision. He wanted the game: what has to work for everything else to work. He answered it himself:",

 {chap:'Chapter 4 of 4 · What I see now',h:'From milk to food',vb:6,ask:['The question that opened this chapter','Yeah, so what I’m what I’m not clear is how does this get into food? So this is about dairy. So how does it get into food? Specifically.','Voice chat with Gemini, 3 Nov 2026, 9:18 am'],p:[

  add:['zones']},
 {chap:'Chapter 4 of 4 · What I see now',h:'The order it gets built in',vb:6,p:[
  "=In his words · voice chat with Gemini, 3 Nov 2026, 8:49 am|Vision, I understand. But there has to be a game, right? A game, because game requires all parties and obviously the money.",
  "=In his words · voice chat with Gemini, 3 Nov 2026, 9:17 am|...there is vision and then there is like a Tesla master plan, right?",
  "Mapped out, the order goes like this. One person's vision, and why they really want it. Then the unit that holds the truth: here, the farm, which took the first eight to ten years.",
  "Then money. Then market access, where the feedback loop starts. Then new products, with the rigour to prove the quality and the organic claim. Then the channels: quick commerce, online, direct, subscription.",
  "=In his words · note, 23 Nov 2026|So all of this is like a very complicated mechanism."],
  add:['plan']},

 {chap:'Chapter 4 of 4 · What I see now',h:'Where it lands, for now',vb:7,p:[
